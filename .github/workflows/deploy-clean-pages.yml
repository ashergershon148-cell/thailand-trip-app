name: Deploy clean app and enable Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deploy-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch clean sources from tunnel if needed
        env:
          BASE: https://gps-risks-murphy-tournament.trycloudflare.com
        run: |
          set -euo pipefail
          NEED=0
          if [ ! -f data.js ] || [ "$(wc -c < data.js)" -lt 30000 ]; then NEED=1; fi
          if [ ! -f app.js ] || [ "$(wc -c < app.js)" -lt 40000 ]; then NEED=1; fi
          if [ "$NEED" = "0" ]; then
            echo "Clean sources already present"
            ls -la index.html styles.css data.js app.js README.md || true
            exit 0
          fi
          echo "Fetching clean sources from $BASE"
          for f in index.html styles.css data.js app.js README.md; do
            curl -fsSL "$BASE/$f" -o "$f"
            wc -c "$f"
          done
          test "$(wc -c < data.js)" -gt 30000
          test "$(wc -c < app.js)" -gt 40000
          touch .nojekyll
          rm -f loader.js parts-fixes.json sizetest.txt sizetest2.txt encoding-test.txt || true
          rm -f README.md.gz.b64.00 app.js.gz.b64.00 app.js.gz.b64.01 app.js.gz.b64.02 app.js.gz.b64.03 app.js.gz.b64.04 || true
          rm -f data.js.b64 data.js.b64.00 data.js.b64.p0 data.js.b64.p1 data.js.b64.p3 || true
          rm -f data.js.chunk* app.js.chunk* || true
          ls -la
      - name: Commit clean sources to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Deploy clean Hebrew Thailand trip app sources (overwrite junk parts)"
            git push
          fi
      - name: Enable GitHub Pages (main /)
        run: |
          set +e
          AUTH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          ACCEPT="Accept: application/vnd.github+json"
          VER="X-GitHub-Api-Version: 2022-11-28"
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          echo "POST pages..."
          curl -sS -o /tmp/pages_post -w "POST:%{http_code}\n" -X POST -H "$AUTH" -H "$ACCEPT" -H "$VER" "$API" -d "$BODY"
          cat /tmp/pages_post; echo
          echo "PUT pages..."
          curl -sS -o /tmp/pages_put -w "PUT:%{http_code}\n" -X PUT -H "$AUTH" -H "$ACCEPT" -H "$VER" "$API" -d "$BODY"
          cat /tmp/pages_put; echo
          echo "GET pages..."
          curl -sS -H "$AUTH" -H "$ACCEPT" -H "$VER" "$API" || true
          echo
