name: Assemble app and enable Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble chunked files if present
        run: |
          set -e
          if ! ls data.js.chunk* >/dev/null 2>&1 && ! ls app.js.chunk* >/dev/null 2>&1; then
            echo "No chunks to assemble"
            exit 0
          fi
          python3 << 'PY'
          from pathlib import Path
          for name in ['data.js', 'app.js']:
              chunks = sorted(Path('.').glob(f'{name}.chunk*'), key=lambda p: int(p.name.split('chunk')[1]))
              if not chunks:
                  continue
              text = ''.join(c.read_text(encoding='utf-8') for c in chunks)
              Path(name).write_text(text, encoding='utf-8')
              print('wrote', name, len(text), 'from', len(chunks), 'chunks')
              for c in chunks:
                  c.unlink()
          PY
          rm -f encoding-test.txt sizetest.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Assemble data.js and app.js from chunks"
            git push
          fi
  enable-pages:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages from main root
        run: |
          set +e
          echo "Attempting to create/update Pages site..."
          curl -sS -o /tmp/pages_post -w "POST:%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          cat /tmp/pages_post; echo
          curl -sS -o /tmp/pages_put -w "PUT:%{http_code}\n" \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          cat /tmp/pages_put; echo
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true
